aid: novidea
name: Novidea
description: >-
  Novidea is a cloud-native insurance management platform built on Salesforce
  that helps insurance brokers, MGAs (managing general agents), coverholders,
  and carriers digitize the full insurance distribution lifecycle across front,
  middle, and back office operations. The platform unifies quoting, underwriting,
  binding, policy administration, claims, and accounting with real-time data and
  analytics, workflow automation, document generation, and customer portals. It
  markets a "truly open API framework" and an "API a la carte" offering for
  extending and integrating the platform, but does not publish a public developer
  portal, API reference, OpenAPI definition, or SDKs; its API surface is delivered
  to customers on top of the Salesforce platform. Novidea is backed by Battery
  Ventures and serves insurance distribution businesses globally.
